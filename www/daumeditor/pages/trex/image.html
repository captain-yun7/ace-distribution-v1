<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=euc-kr">
<title>사진 첨부</title>
<script src="../../js/popup.js" type="text/javascript" charset="euc-kr"></script>
<link rel="stylesheet" href="../../css/popup.css" type="text/css"  charset="euc-kr"/>


<!-- Plupload -->
<link rel="stylesheet" href="/plupload/examples/css/plupload.queue.css" type="text/css" media="screen" />
<script type="text/javascript" src="http://www.google.com/jsapi"></script>
<script type="text/javascript">
	google.load("jquery", "1.3");
</script>

<script type="text/javascript" src="/plupload/js/plupload.full.min.js"></script>
<script type="text/javascript" src="/plupload/js/jquery.plupload.queue.min.js"></script>
<!-- Plupload -->

<script type="text/javascript">
// <![CDATA[
	function initUploader(){
	    var _opener = PopupUtil.getOpener();
	    if (!_opener) {
	        alert('잘못된 경로로 접근하셨습니다.');
	        return;
	    }

	    var _attacher = getAttacher('image', _opener);
	    registerAction(_attacher);
	}
// ]]>
</script>
</head>
<body onload="initUploader();">
<div class="wrapper">
	<form method="post" action="/plupload/examples/dump.php">
	<div class="header">
		<h1>사진 첨부</h1>
	</div>
	<div class="body">
		<!-- 이미지 업로드 -->
			<script type="text/javascript">
			// Convert divs to queue widgets when the DOM is ready
			$(function() {
				$("#uploader").pluploadQueue({
					// General settings
					runtimes : 'flash',
					url : '/plupload/examples/upload.php',
					max_file_size : '10mb',
					//chunk_size : '2mb',
					unique_names : true,

					// Resize images on clientside if we can
					// resize : {width : 320, height : 240, quality : 90},

					// Specify what files to browse for
					filters : [
						{title : "Image files", extensions : "jpg,gif,png"}
					],

					// Flash settings
					flash_swf_url : '/plupload/js/plupload.flash.swf'
				});

				// Client side form validation
				$('form').submit(function(e) {
					var uploader = $('#uploader').pluploadQueue();

					// Validate number of uploaded files
					if (uploader.total.uploaded == 0) {
						// Files in queue upload them first
						if (uploader.files.length > 0) {
							// When all files are uploaded submit form
							uploader.bind('UploadProgress', function() {
								if (uploader.total.uploaded == uploader.files.length)
									$('form').submit();
							});

							uploader.start();
						} else
							alert('파일을 한 개 이상 첨부해 주세요.');

						e.preventDefault();
					}
				});
			});
			</script>

			<div id="uploader">
				<p>플래시 플레이어가 필요합니다.</p>
			</div>

		<!-- 이미지 업로드 -->
	</div>
	<div class="footer">
		<ul>
			<li class="submit">
				<input type="image" src="/daumeditor/images/icon/editor/btn_upload_submit.gif">
			</li>
			<li class="cancel"><a href="#" onclick="closeWindow();" title="취소">취소</a></li>
		</ul>
	</div>
	</form>
</div>
</body>
</html>
